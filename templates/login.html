<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Login · Kettle & Crate</title>
<script>
  (function () {
    var t = localStorage.getItem("kc-theme");
    if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
<div class="aurora"><span></span><span></span><span></span></div>
<div class="grain"></div>
<div class="login-page">
  <div class="login-card">
    <div class="brand"><span class="brand__mark">🫖</span> Kettle &amp; Crate</div>
    <p>Staff dashboard access</p>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="password" name="password" placeholder="Password" autofocus required>
      <button class="btn btn--primary" type="submit">Log in</button>
    </form>
  </div>
</div>
<script src="{{ url_for('static', filename='js/aurora.js') }}"></script>
</body>
</html>
